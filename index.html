/* Layout: sidebar navigasi kiri (jadi bar geser di HP) + area kerja; ringkasan di atas, detail di bawah. */
:root{
  --bg:#eff4f5; --surface:#ffffff; --surface2:#f5f9fa; --ink:#12242b; --muted:#5a7078; --line:#d9e3e6;
  --brand:#0b6e7f; --brand-soft:#d9eef2; --brand-ink:#ffffff; --heat:#e0602a; --heat-soft:#fbe6dc;
  --good:#1a8556; --good-soft:#dcf2e7; --warn:#a8730a; --warn-soft:#fbeccb; --bad:#c23636; --bad-soft:#f9e0e0;
  --shadow:0 1px 2px rgba(18,36,43,.06),0 4px 14px rgba(18,36,43,.05);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1a1f; --surface:#13262d; --surface2:#182f37; --ink:#e5f0f2; --muted:#8ea7af; --line:#25424c;
  --brand:#41c3d8; --brand-soft:#173a43; --brand-ink:#06242b; --heat:#ff8d5a; --heat-soft:#3a2418;
  --good:#4cc990; --good-soft:#15352a; --warn:#e8b64d; --warn-soft:#3a2f12; --bad:#ff7b7b; --bad-soft:#3d1c1e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1a1f; --surface:#13262d; --surface2:#182f37; --ink:#e5f0f2; --muted:#8ea7af; --line:#25424c;
  --brand:#41c3d8; --brand-soft:#173a43; --brand-ink:#06242b; --heat:#ff8d5a; --heat-soft:#3a2418;
  --good:#4cc990; --good-soft:#15352a; --warn:#e8b64d; --warn-soft:#3a2f12; --bad:#ff7b7b; --bad-soft:#3d1c1e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;padding-block:20px 48px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-display);font-size:18px;line-height:1.1;display:block}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;text-align:left}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
.nav svg{width:18px;height:18px;flex:none}
.sidefoot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.head h1{font-size:26px;font-weight:800}
.head p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.del{color:var(--bad)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:16px;margin-bottom:10px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:600;letter-spacing:-.03em;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.p-Baru{background:var(--brand-soft);color:var(--brand)}
.p-Dijadwalkan{background:var(--warn-soft);color:var(--warn)}
.p-Dikerjakan{background:var(--heat-soft);color:var(--heat)}
.p-Selesai,.p-Lunas,.p-Hadir,.p-Aman{background:var(--good-soft);color:var(--good)}
.p-Batal,.p-Alpa,.p-Terlambat{background:var(--bad-soft);color:var(--bad)}
.p-Dicetak{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.p-Belum,.p-Segera,.p-Izin,.p-Sakit,.p-Telat{background:var(--warn-soft);color:var(--warn)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:99px;cursor:pointer;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar i.ok{background:var(--good)} .bar i.mid{background:var(--warn)} .bar i.low{background:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px}
.info{background:var(--brand-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(5,15,20,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal[hidden]{display:none!important}
.sheet{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:calc(100% - 8px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.inv{background:#fff;color:#14232a;border-radius:10px;padding:24px;border:1px solid var(--line);max-width:720px}
.inv table{min-width:0}.inv th{background:#eef3f4;color:#4b6068}.inv td,.inv th{border-color:#d7e1e4}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px;padding-block:12px 40px}
  .side{position:static;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .nav button{white-space:nowrap;padding:8px 12px}
  .sidefoot{display:none}
  .head h1{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s,filter .15s}}
</style>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const rpk=n=>{n=n||0;const a=Math.abs(n);return (n<0?'-':'')+(a>=1e6?(a/1e6).toFixed(1).replace('.',',')+' jt':a>=1e3?Math.round(a/1e3)+' rb':a)};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const addM=(s,n)=>{const d=pd(s);d.setMonth(d.getMonth()+n);return iso(d)};
const diffD=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const TODAY=iso(new Date());
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fd=s=>{if(!s)return '-';const d=pd(s);return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()};
const fds=s=>{const d=pd(s);return d.getDate()+' '+BLN[d.getMonth()]};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
const KEY='awaljaya.v1';
const SERV={'Cuci AC':85000,'Tambah Freon':250000,'Perbaikan':350000,'Instalasi':450000,'Bongkar Pasang':400000,'Pengecekan':0};
const STAT=['Baru','Dijadwalkan','Dikerjakan','Selesai','Batal'];
const KAT_IN=['Jasa servis','Penjualan sparepart','Kontrak perawatan','Lainnya'];
const KAT_OUT=['Material & freon','Gaji karyawan','Bensin & transport','Sewa & listrik','Peralatan','Lainnya'];
let S=null;
/* ===== SINKRON KE SUPABASE (tabel app_state), tanpa localStorage ===== */
/* Hari kerja: tiap bulan libur 4 hari (Minggu ke-1 sampai ke-4, tanggal 1-28). Minggu ke-5 (tanggal 29-31) dihitung hari kerja.
   Jadi: 31 hari = 27 hari kerja, 30 = 26, 29 = 25, 28 = 24. */
function isHK(t){return pd(t).getDay()!==0||+String(t).slice(8,10)>=29}
const SYNC={ready:false,snap:{},timer:null,client:Math.random().toString(36).slice(2)+Date.now().toString(36),chan:null,busy:false,again:false,fail:false,pend:false};
function stateKeys(){return Object.keys(S||{}).filter(k=>k!=='tab')}
const RESCUE_KEY='punggawa.rescue.v1';
function isObj(x){return x&&typeof x==='object'&&!Array.isArray(x)}
function jj(x){return JSON.stringify(x)}
function itemKey(o){if(!isObj(o))return null;if(o.id!=null)return 'i:'+o.id;if(o.no!=null)return 'n:'+o.no;return null}
function mergeArr(base,loc,srv){
  base=Array.isArray(base)?base:[];
  const useKey=[...loc,...srv].length>0&&[...loc,...srv].every(x=>itemKey(x)!=null);
  if(!useKey){ /* tanpa id: gabungkan unik berdasarkan isi */
    if(jj(loc)===jj(base))return srv; if(jj(srv)===jj(base)||jj(srv)===jj(loc))return loc;
    const seen=new Set(),out=[];[...srv,...loc].forEach(x=>{const k=jj(x);if(!seen.has(k)){seen.add(k);out.push(x)}});return out}
  const bm=new Map(),sm=new Map(),lm=new Map();
  base.forEach(x=>{const k=itemKey(x);if(k)bm.set(k,x)});srv.forEach(x=>sm.set(itemKey(x),x));loc.forEach(x=>lm.set(itemKey(x),x));
  const out=[],used=new Set();
  loc.forEach(l=>{const k=itemKey(l);used.add(k);const b=bm.get(k),sv=sm.get(k);
    if(b===undefined){out.push(sv===undefined?l:(jj(sv)===jj(l)?l:mergeVal(undefined,l,sv,1)));return}
    if(sv===undefined){if(jj(l)!==jj(b))out.push(l);return} /* dihapus di server: simpan hanya jika lokal mengubahnya */
    if(jj(l)===jj(b))out.push(sv);else if(jj(sv)===jj(b)||jj(sv)===jj(l))out.push(l);else out.push(mergeVal(b,l,sv,1))});
  srv.forEach(sv=>{const k=itemKey(sv);if(used.has(k))return;const b=bm.get(k);
    if(b===undefined||jj(b)!==jj(sv))out.push(sv)}); /* baru di server, atau dihapus lokal tapi diubah di server */
  return out}
function mergeVal(base,loc,srv,d){
  if(jj(srv)===jj(loc))return loc;
  if(base!==undefined&&jj(loc)===jj(base))return srv;
  if(base!==undefined&&jj(srv)===jj(base))return loc;
  if(Array.isArray(loc)&&Array.isArray(srv))return mergeArr(base,loc,srv);
  if(isObj(loc)&&isObj(srv)&&d<3){
    const b=isObj(base)?base:{},out={},keys=new Set([...Object.keys(srv),...Object.keys(loc)]);
    keys.forEach(k=>{const inL=k in loc,inS=k in srv,inB=k in b;
      if(inL&&inS)out[k]=mergeVal(inB?b[k]:undefined,loc[k],srv[k],d+1);
      else if(inL){if(!inB||jj(loc[k])!==jj(b[k]))out[k]=loc[k]}
      else if(inS){if(!inB||jj(srv[k])!==jj(b[k]))out[k]=srv[k]}});
    return out}
  return loc}
function rescueSave(){try{localStorage.setItem(RESCUE_KEY,JSON.stringify({t:Date.now(),client:SYNC.client,user:(SES&&(SES.username||SES.name))||'',data:S}))}catch(e){}}
function rescueClear(){try{const r=JSON.parse(localStorage.getItem(RESCUE_KEY)||'null');if(r&&r.client===SYNC.client)localStorage.removeItem(RESCUE_KEY)}catch(e){}}
function setBadge(kind,msg,again){
  try{
    let el=document.getElementById('syncbadge');
    if(!SES){if(el)el.remove();document.body.classList.remove('syncwarn');return}
    if(kind==='ok'||kind==='busy'){if(el)el.remove();document.body.classList.remove('syncwarn');return}
    if(!el){el=document.createElement('div');el.id='syncbadge';el.setAttribute('role','alert');
      el.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);font:600 13px/1.35 system-ui,sans-serif;box-shadow:0 -3px 14px rgba(0,0,0,.35);color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between'}
    if(!document.body.contains(el))document.body.appendChild(el);
    el.style.background=kind==='warn'?'#b45309':'#b91c1c';
    const sb='style="background:#fff;color:#111;border:0;border-radius:8px;padding:7px 12px;font:700 12px system-ui;cursor:pointer"';
    el.innerHTML='<span style="flex:1 1 220px">'+esc(msg)+'</span><span style="display:flex;gap:6px"><button type="button" data-act="syncRetry" '+sb+'>Coba simpan lagi</button><button type="button" data-act="syncDl" '+sb+'>Unduh cadangan</button></span>';
    document.body.classList.add('syncwarn');
  }catch(e){}
}
async function retrySync(){
  if(!SYNC.ready){setBadge('busy','Menyambungkan ulang...');await bootData();render();if(!SYNC.ready){SYNC.fail=true;setBadge('err','✕ Masih belum tersambung. Cek internet / login ulang. Data di layar BELUM tersimpan.')}else await syncNow();return}
  await syncNow();
}
async function syncNow(){
  if(!S)return;
  if(!SYNC.ready){SYNC.fail=true;rescueSave();setBadge('warn','⚠ Belum tersambung ke database — data BELUM tersimpan. Cadangan darurat disimpan di browser ini.');return}
  if(SYNC.busy){SYNC.again=true;return}
  SYNC.busy=true;SYNC.pend=false;
  setBadge('busy','Menyimpan ke database...');
  let merged=false;
  try{
    const dirty=stateKeys().filter(k=>SYNC.snap[k]!==jj(S[k]));
    if(dirty.length){
      rescueSave();
      const {data:srvRows,error:e1}=await supabaseClient.from('app_state').select('key,value').in('key',dirty);
      if(e1)throw e1;
      const sm={};(srvRows||[]).forEach(r=>sm[r.key]=r.value);
      dirty.forEach(k=>{
        if(!(k in sm))return;
        const sj=jj(sm[k]);if(sj===SYNC.snap[k]||sj===jj(S[k]))return;
        let base;try{base=SYNC.snap[k]===undefined?(Array.isArray(sm[k])?[]:{}):JSON.parse(SYNC.snap[k])}catch(e){base=undefined}
        S[k]=mergeVal(base,S[k],sm[k],0);merged=true});
      const rows=dirty.map(k=>({key:k,value:S[k],client:SYNC.client,_j:jj(S[k])}));
      const {error}=await supabaseClient.from('app_state').upsert(rows.map(r=>({key:r.key,value:r.value,client:r.client})),{onConflict:'key'});
      if(error)throw error;
      rows.forEach(r=>{SYNC.snap[r.key]=r._j});
    }
    SYNC.fail=false;
    if(!SYNC.again&&stateKeys().every(k=>SYNC.snap[k]===jj(S[k])))rescueClear();
    setBadge('ok');
    if(merged){const m=$('#modal');if(!m||m.hidden){try{if(typeof mig==='function')mig();render();toast('Data digabung dengan perubahan perangkat lain')}catch(e){}}}
  }catch(e){
    console.error('Gagal simpan ke Supabase:',e);SYNC.fail=true;rescueSave();
    setBadge('err','✕ GAGAL SIMPAN ke database: '+((e&&e.message)||'jaringan?')+'. Jangan tutup halaman! Cadangan darurat tersimpan di browser ini.');
  }
  SYNC.busy=false;
  if(SYNC.again){SYNC.again=false;syncNow()}
}
function save(){SYNC.pend=true;try{rescueSave()}catch(e){}if(!SYNC.ready)setBadge('warn','⚠ Belum tersambung ke database — data BELUM tersimpan.');clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncNow,300)}
window.addEventListener('pagehide',()=>{try{syncNow()}catch(e){}});
function rescueCheck(){
  try{
    const r=JSON.parse(localStorage.getItem(RESCUE_KEY)||'null');
    if(!r||!r.data||r.client===SYNC.client||document.getElementById('rescuebox'))return;
    /* jika semua isi cadangan sudah sama dengan data sekarang (sudah tersimpan), buang diam-diam */
    try{if(SYNC.ready&&!SYNC.fail&&!SYNC.pend&&Object.keys(r.data).every(k=>jj(S[k])===jj(r.data[k]))){localStorage.removeItem(RESCUE_KEY);return}}catch(e){}
    const d=new Date(r.t),t=d.toLocaleString('id-ID');
    const o=document.createElement('div');o.id='rescuebox';
    o.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px';
    o.innerHTML='<div style="background:#fff;color:#111;border-radius:14px;padding:20px;max-width:420px;font:14px/1.5 system-ui"><h3 style="margin:0 0 8px;font-size:17px">Ada cadangan darurat belum tersimpan</h3><p style="margin:0 0 14px">Pada '+esc(t)+' ada data yang gagal tersimpan ke database dan disimpan sementara di browser ini. Unduh dulu supaya aman.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" data-act="rescueDl" style="background:#b91c1c;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer">Unduh cadangan</button><button type="button" data-act="rescueDrop" style="background:#e5e7eb;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer">Buang</button><button type="button" data-act="rescueLater" style="background:#e5e7eb;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer">Nanti</button></div></div>';
    document.body.appendChild(o);
  }catch(e){}
}
async function load(){
  try{
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){SYNC.ready=false;return seed()}
    const {data,error}=await supabaseClient.from('app_state').select('key,value');
    if(error)throw error;
    const S_new=seed();
    SYNC.snap={};
    (data||[]).forEach(r=>{S_new[r.key]=r.value;SYNC.snap[r.key]=JSON.stringify(r.value)});
    S_new.tab='dash';
    SYNC.ready=true;
    S=S_new;
    if(!data||!data.length){console.log('Database kosong, menyimpan data awal.');syncNow()}
    startRealtime();
    setBadge('ok','✓ Tersambung ke database');
    return S_new;
  }catch(e){
    console.error('Gagal memuat data dari Supabase:',e);
    SYNC.ready=false; /* jangan menimpa database dengan data kosong */
    toast('Gagal memuat data dari database. Muat ulang halaman.');
    setBadge('err','✕ Gagal memuat data: '+(e&&e.message?e.message:'cek tabel app_state / login')+' (klik untuk coba lagi)');
    return seed();
  }
}
function startRealtime(){
  if(SYNC.chan)return;
  SYNC.chan=supabaseClient.channel('app_state_sync')
   .on('postgres_changes',{event:'*',schema:'public',table:'app_state'},pl=>{
     const r=pl.new;if(!r||!r.key||r.client===SYNC.client||!SES)return;
     const rj=JSON.stringify(r.value);
     if(JSON.stringify(S[r.key])===rj){SYNC.snap[r.key]=rj;return}
     const modalOpen=$('#modal')&&!$('#modal').hidden;
     try{
       const b=(typeof nUnread==='function')?nUnread().length:0;
       const dirty=JSON.stringify(S[r.key])!==SYNC.snap[r.key];
       if(dirty){
         let base;try{base=SYNC.snap[r.key]===undefined?undefined:JSON.parse(SYNC.snap[r.key])}catch(e){base=undefined}
         S[r.key]=mergeVal(base,S[r.key],r.value,0);SYNC.snap[r.key]=rj;save();
       }else{S[r.key]=r.value;SYNC.snap[r.key]=rj}
       if(typeof mig==='function')mig();
       if(modalOpen)return; /* jangan ganggu form yang sedang dibuka */
       const a=(typeof nUnread==='function')?nUnread().length:0;
       render();if(a>b)toast('Ada '+(a-b)+' pemberitahuan baru');
     }catch(e){console.error(e)}
   }).subscribe();
}
async function bootData(){
  S=await load();

  const e=Object.entries(m).sort((a,b)=>b[1]-a[1]),tot=sum(e,x=>x[1]);
  return e.length?e.map(([k,v])=>`<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><span>${esc(k)}</span><span class="num">${rp(v)} <small style="color:var(--muted)">${Math.round(v/tot*100)}%</small></span></div><div class="bar"><i style="width:${v/tot*100}%;background:${color}"></i></div></div>`).join(''):'<div class="empty">Belum ada data.</div>';
}
V.keu=()=>{
  const [a,b]=range(U.per,U.a,U.b),L=txIn(a,b);
  const m=sum(L.filter(x=>x.jenis==='Pemasukan'),x=>x.jml),k=sum(L.filter(x=>x.jenis==='Pengeluaran'),x=>x.jml),laba=m-k;
  const kas=sum(L.filter(x=>x.akun==='Kas'),x=>x.jenis==='Pemasukan'?x.jml:-x.jml),bank=sum(L.filter(x=>x.akun==='Bank'),x=>x.jenis==='Pemasukan'?x.jml:-x.jml);
  return `<div class="head"><div><h1>Keuangan</h1><p>${fd(a)}${a!==b?' sampai '+fd(b):''}</p></div><button class="btn pri" data-act="newTx">+ Catat transaksi</button></div>
  ${perBar('per','a','b')}
  <div class="grid g4">
   <div class="card kpi"><small>Pemasukan</small><span class="v" style="color:var(--good)">${rp(m)}</span><span class="s">${L.filter(x=>x.jenis==='Pemasukan').length} transaksi</span></div>
   <div class="card kpi"><small>Pengeluaran</small><span class="v" style="color:var(--heat)">${rp(k)}</span><span class="s">${L.filter(x=>x.jenis==='Pengeluaran').length} transaksi</span></div>
   <div class="card kpi"><small>Laba bersih</small><span class="v" style="color:${laba>=0?'var(--good)':'var(--bad)'}">${rp(laba)}</span><span class="s">margin ${m?Math.round(laba/m*100):0}%</span></div>
   <div class="card kpi"><small>Arus kas &amp; bank</small><span class="v" style="font-size:16px">Kas ${rp(kas)}</span><span class="s num">Bank ${rp(bank)}</span></div>
  </div>
  <div class="card"><div class="row" style="justify-content:space-between"><h3>Pemasukan vs pengeluaran</h3><div class="legend"><span><i style="background:var(--brand)"></i>Masuk</span><span><i style="background:var(--heat)"></i>Keluar</span></div></div>${barChart(groupTx(a,b,L))}</div>
  <div class="grid g2"><div class="card"><h3>Sumber pemasukan</h3>${breakdown(L,'Pemasukan','var(--brand)')}</div><div class="card"><h3>Rincian pengeluaran</h3>${breakdown(L,'Pengeluaran','var(--heat)')}</div></div>`;
};
function txForm(t){
  const B=S.set.banks||[],F=[{k:'tgl',l:'Tanggal',t:'date',req:1,def:TODAY},{k:'jenis',l:'Jenis',t:'select',o:['Pemasukan','Pengeluaran'],def:'Pemasukan'},
   {k:'kat',l:'Kategori',t:'select',o:t&&t.jenis==='Pengeluaran'?KAT_OUT:KAT_IN,def:'Jasa servis'},{k:'akun',l:'Akun',t:'select',o:[['Kas','Kas Kecil'],['Bank','Bank']],def:'Kas'},
   {k:'bankId',l:'Rekening bank',t:'select',o:B.length?B.map(b=>[b.id,bankLbl(b)]):[['','Belum ada rekening bank']],def:B.length?B[0].id:''},
   {k:'jml',l:'Jumlah (Rp)',t:'number',min:1,req:1},{k:'ket',l:'Keterangan',wide:1,req:1}];
  form(t?'Ubah transaksi':'Catat transaksi',F,t,v=>{v.bankId=v.akun==='Bank'?(v.bankId||''):'';v.bankNm=v.akun==='Bank'?bankNmById(v.bankId):'';if(t)Object.assign(t,v);else addTx(v);save();render();toast('Transaksi disimpan')});
  $('#f_jenis').addEventListener('change',e=>{const o=e.target.value==='Pemasukan'?KAT_IN:KAT_OUT;$('#f_kat').innerHTML=o.map(x=>`<option>${x}</option>`).join('')});
  {const ak=$('#f_akun'),bl=$('#f_bankId').closest('label'),sy=()=>{bl.style.display=ak.value==='Bank'?'':'none'};ak.addEventListener('change',sy);sy()}
}
A.newTx=()=>txForm(null);
</script>
<script>
function remList(){
  const done=S.orders.filter(o=>o.layanan==='Cuci AC'&&o.status==='Selesai');
  const by={};done.forEach(o=>{if(!by[o.nama]||o.tgl>by[o.nama].tgl)by[o.nama]=o});
  return Object.values(by).map(o=>{
    const iv=Number((S.remInt&&S.remInt[o.nama])||S.set.interval)||3,due=addM(o.tgl,iv),left=diffD(due,TODAY);
    const pending=S.orders.some(x=>x.nama===o.nama&&ACT_ST.includes(x.status)&&x.tgl>o.tgl);
    const st=pending?'Aman':left<0?'Terlambat':left<=S.set.lead?'Segera':'Aman';
    const sent=S.rem[o.nama];const sentNow=sent&&sent>=o.tgl?sent:null;
    return {nama:o.nama,hp:o.hp,alamat:o.alamat,last:o.tgl,due,left,st,pending,sent:sentNow,iv};
  }).sort((a,b)=>a.left-b.left);
}
function remMsg(r){return S.set.tpl.replace(/\{nama\}/g,r.nama).replace(/\{usaha\}/g,S.set.nama).replace(/\{alamat\}/g,r.alamat).replace(/\{terakhir\}/g,fd(r.last)).replace(/\{jatuh_tempo\}/g,fd(r.due))}
const waNo=hp=>{let d=String(hp||'').replace(/\D/g,'');if(d.startsWith('620'))d='62'+d.slice(3);else if(d.startsWith('0'))d='62'+d.slice(1);else if(d.startsWith('8'))d='62'+d;return d};
const waLink=(hp,t)=>'https://wa.me/'+waNo(hp)+'?text='+encodeURIComponent(t);
V.wa=()=>{
  const all=remList(),need=all.filter(r=>r.st!=='Aman'&&!r.sent),f=U.wf||'perlu',rows=f==='perlu'?need:all;const P=paginate('w',rows,f);
  return `<div class="head"><div><h1>Reminder WA Cuci AC</h1><p>Pelanggan yang sudah waktunya cuci rutin, lengkap dengan pesan siap kirim.</p></div></div>
  <div class="grid g4">
   <div class="card kpi"><small>Perlu dihubungi</small><span class="v">${need.length}</span><span class="s">terlambat atau jatuh tempo ≤ ${S.set.lead} hari</span></div>
   <div class="card kpi"><small>Terlambat</small><span class="v" style="color:var(--bad)">${all.filter(r=>r.st==='Terlambat').length}</span><span class="s">lewat jatuh tempo</span></div>
   <div class="card kpi"><small>Sudah dikirimi</small><span class="v">${all.filter(r=>r.sent).length}</span><span class="s">pada siklus cuci terakhir</span></div>
   <div class="card kpi"><small>Total pelanggan cuci</small><span class="v">${all.length}</span><span class="s">pernah selesai cuci AC</span></div>
  </div>
  <div class="grid g2">
   <div class="card"><h3>Aturan pengingat</h3><div class="fgrid">
    <label class="f">Cuci ulang setiap (default semua pelanggan)<select id="s_int" data-chg="remDef">${[...new Set([1,2,3,Number(S.set.interval)||3])].sort((a,b)=>a-b).map(n=>`<option value="${n}"${Number(S.set.interval)===n?' selected':''}>${n} bulan</option>`).join('')}</select></label>
    <label class="f">Ingatkan sebelum (hari)<input id="s_lead" type="number" min="0" max="60" value="${S.set.lead}" data-chg="set" data-k="lead"></label>
    <label class="f" style="grid-column:1/-1">Isi pesan<textarea id="s_tpl" data-chg="set" data-k="tpl">${esc(S.set.tpl)}</textarea></label></div>
    <p style="color:var(--muted);font-size:12px;margin:8px 0 0">Kata kunci: {nama} {usaha} {alamat} {terakhir} {jatuh_tempo}</p></div>
   <div class="card"><h3>Cara kerja</h3><div class="info">Daftar dan pesan dihitung otomatis dari order cuci AC yang berstatus Selesai. Tombol "Buka WhatsApp" membuka chat dengan pesan sudah terisi, tinggal kirim. Pengiriman tanpa klik butuh layanan WhatsApp Business API, yang tidak bisa dijalankan dari halaman ini.</div>
    ${all[0]?`<p style="margin:12px 0 4px;font-weight:600">Contoh pesan untuk ${esc(all[0].nama)}</p><div style="background:var(--surface2);border-radius:10px;padding:10px 12px;white-space:pre-wrap">${esc(remMsg(all[0]))}</div>`:''}</div>
  </div>
  <div class="card"><div class="tabs" style="margin-bottom:12px"><button class="chip" aria-pressed="${f==='perlu'}" data-act="wf" data-v="perlu">Perlu dihubungi (${need.length})</button><button class="chip" aria-pressed="${f==='semua'}" data-act="wf" data-v="semua">Semua pelanggan (${all.length})</button></div>
  <div class="tw"><table><thead><tr><th>Pelanggan</th><th>Terakhir cuci</th><th>Siklus</th><th>Jatuh tempo</th><th>Status</th><th>Pesan</th><th></th></tr></thead><tbody>
  ${rows.length?P.items.map(r=>`<tr><td><b>${esc(r.nama)}</b><br><small class="num" style="color:var(--muted)">${esc(r.hp)}</small></td><td>${fd(r.last)}</td><td><select data-chg="remInt" data-n="${esc(r.nama)}" aria-label="Siklus cuci ${esc(r.nama)}" style="width:auto;min-width:96px">${[1,2,3].map(n=>`<option value="${n}"${r.iv===n?' selected':''}>${n} bulan</option>`).join('')}${[1,2,3].includes(r.iv)?'':`<option value="${r.iv}" selected>${r.iv} bulan</option>`}</select></td><td>${fd(r.due)}<br><small style="color:var(--muted)">${r.left<0?Math.abs(r.left)+' hari lewat':r.left+' hari lagi'}</small></td>
  <td><span class="pill p-${r.st}">${r.pending?'Sudah dijadwalkan':r.st}</span></td><td>${r.sent?'<span class="pill p-Lunas">Ditandai terkirim '+fds(r.sent)+'</span>':'<small style="color:var(--muted)">Belum dikirim</small>'}</td>
  <td class="r"><div class="row" style="justify-content:flex-end">${waNo(r.hp).length>=10?`<a class="btn sm pri" href="${waLink(r.hp,remMsg(r))}" target="_blank" rel="noopener">Buka WhatsApp</a>`:'<small style="color:var(--bad)">No. WA kosong / tidak valid</small>'}<button class="btn sm" data-act="remCopy" data-n="${esc(r.nama)}">Salin</button><button class="btn sm" data-act="remMark" data-n="${esc(r.nama)}">Tandai terkirim</button></div></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Tidak ada pelanggan yang perlu dihubungi hari ini.</td></tr>'}
  </tbody></table></div>${P.html}</div>`;
};
A.wf=b=>{U.wf=b.dataset.v;render()};
CH.set=el=>{const k=el.dataset.k;S.set[k]=el.type==='number'?Math.max(0,Number(el.value)||0):el.value;save();render()};
function copyText(t){return navigator.clipboard.writeText(t).then(()=>toast('Tersalin')).catch(()=>toast('Browser menolak menyalin, salin manual dari kotak pesan'))}
A.remCopy=b=>{const r=remList().find(x=>x.nama===b.dataset.n);if(r)copyText(remMsg(r))};
A.remMark=b=>{S.rem[b.dataset.n]=TODAY;save();render();toast('Ditandai sudah dikirim')};
const ppnRate=()=>Number(S.set.ppnRate)||11;
const ppnOf=(mat,sub,dsk,mode,rate)=>{const mn=sub?Math.round(mat*(sub-dsk)/sub):0;if(mode==='incl'){const v=Math.round(mn*rate/(100+rate));return{mn,v,add:0}}if(mode==='excl'){const v=Math.round(mn*rate/100);return{mn,v,add:v}}return{mn,v:0,add:0}};
const invTot=i=>{const s=sum(i.items,x=>x.qty*x.harga),net=Math.max(0,s-(i.diskon||0)),r={sub:s,tot:net};
 if(i.ppn&&i.ppn.rate){const m=sum(i.items,x=>(x.jenis==='barang'||x.sid)?x.qty*x.harga:0),o=ppnOf(m,s,Math.min(s,i.diskon||0),i.ppn.mode,i.ppn.rate);r.ppn=o.v;r.mat=o.mn;r.tot=net+o.add}
 return r};
const payOf=i=>i.bayar==='transfer'?'transfer':(i.bayar==='termin'||(!i.bayar&&i.tempo&&i.tgl&&i.tempo!==i.tgl))?'termin':'cash';
const invShowBank=i=>payOf(i)==='transfer'||(payOf(i)==='termin'&&i.tagihAkun==='Bank'&&!!i.bankId);
const payLbl=i=>{const m=payOf(i);return m==='termin'?'Termin '+(i.top||Math.max(1,diffD(i.tempo,i.tgl)))+' hari (TOP)'+(i.tagihAkun==='Bank'?' · Bank':i.tagihAkun==='Kas'?' · Cash':''):m==='transfer'?'Transfer':'Cash'};
const invStat=i=>i.appr==='Menunggu'&&i.dicetak?'Dicetak':i.appr==='Menunggu'?'Menunggu':i.appr==='Ditolak'?'Ditolak':i.status==='Lunas'?'Lunas':i.tempo<TODAY?'Telat':'Belum';
V.inv=()=>{
  const q=U.invq.toLowerCase(),L=[...S.inv].sort((a,b)=>a.tgl<b.tgl?1:-1).filter(i=>!q||(i.no+i.nama).toLowerCase().includes(q));
  const open=S.inv.filter(i=>i.status!=='Lunas'&&(!i.appr||i.appr==='Disetujui'));const P=paginate('i',L,U.invq);
  return `<div class="head"><div><h1>Invoice</h1><p>Buat tagihan, kirim ke pelanggan, tandai lunas.</p></div><button class="btn pri" data-act="newInv">+ Invoice baru</button></div>
  <div class="grid g4"><div class="card kpi"><small>Belum dibayar</small><span class="v">${rp(sum(open,i=>invTot(i).tot))}</span><span class="s">${open.length} invoice</span></div>
  <div class="card kpi"><small>Telat bayar</small><span class="v" style="color:var(--bad)">${open.filter(i=>i.tempo<TODAY).length}</span><span class="s">lewat jatuh tempo</span></div>
  <div class="card kpi"><small>Lunas bulan ini</small><span class="v">${rp(sum(S.inv.filter(i=>i.status==='Lunas'&&i.tgl.startsWith(TODAY.slice(0,7))),i=>invTot(i).tot))}</span><span class="s">dari invoice bulan ini</span></div></div>
  <div class="card"><input id="iq" placeholder="Cari no. invoice atau pelanggan" value="${esc(U.invq)}" data-inp="iq" style="max-width:300px;margin-bottom:12px"><div class="tw"><table><thead><tr><th>No.</th><th>Tanggal</th><th>Pelanggan</th><th>Jatuh tempo</th><th class="r">Total</th><th>Status</th><th></th></tr></thead><tbody>
  ${L.length?P.items.map(i=>`<tr><td class="num">${i.no}</td><td>${fds(i.tgl)}</td><td>${esc(i.nama)}</td><td>${fds(i.tempo)}</td><td class="r num">${rp(invTot(i).tot)}</td><td><span class="pill p-${invStat(i)}">${invStat(i)}</span></td><td class="r"><button class="btn sm" data-act="viewInv" data-id="${i.id}">Buka</button> ${i.appr==='Ditolak'&&canKas()?`<button class="btn sm pri" data-act="invEdit" data-id="${i.id}">Edit</button> `:''}<button class="btn sm del" data-act="delInv" data-id="${i.id}">Hapus</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Belum ada invoice. Klik "Invoice baru".</td></tr>'}</tbody></table></div>${P.html}</div>`;
};
CH.iq=el=>{U.invq=el.value;render()};
A.delInv=b=>{S.inv=S.inv.filter(i=>i.id!==b.dataset.id);save();render();toast('Invoice dihapus')};
function itemRow(x){return `<tr><td><input data-r="desc" value="${esc(x.desc)}" placeholder="Deskripsi"></td><td style="width:70px"><input data-r="qty" type="number" min="1" value="${x.qty}"></td><td style="width:130px"><input data-r="harga" type="number" min="0" value="${x.harga}"></td><td style="width:44px"><button type="button" class="btn sm del" data-act="rmRow" aria-label="Hapus baris">×</button></td></tr>`}
A.rmRow=b=>{const tb=b.closest('tbody');if(tb.rows.length>1){b.closest('tr').remove();invCalc()}};
A.addRow=()=>{$('#ibody').insertAdjacentHTML('beforeend',itemRow({desc:'',qty:1,harga:0}))};
function invCalc(){const s=$$('#ibody tr').reduce((t,r)=>t+(Number($('[data-r=qty]',r).value)||0)*(Number($('[data-r=harga]',r).value)||0),0);$('#itot').textContent=rp(Math.max(0,s-(Number($('#f_diskon').value)||0)))}
A.newInv=()=>{
  const nxt='INV-'+TODAY.slice(2,4)+TODAY.slice(5,7)+'-'+pad(S.inv.filter(i=>i.no.startsWith('INV-'+TODAY.slice(2,4)+TODAY.slice(5,7))).length+1);
  const oo=S.orders.filter(o=>o.status==='Selesai').sort((a,b)=>a.tgl<b.tgl?1:-1).slice(0,25);
  modal(`<h2 style="font-size:20px">Invoice baru ${nxt}</h2><form id="mf" class="grid" style="gap:14px">
  <label class="f">Isi dari order selesai<select id="f_ord"><option value="">Isi manual</option>${oo.map(o=>`<option value="${o.id}">${o.id} - ${esc(o.nama)} (${fds(o.tgl)})</option>`).join('')}</select></label>
  <div class="fgrid"><label class="f">Nama pelanggan<input id="f_nama" required list="dl_c"></label><datalist id="dl_c">${S.cust.map(c=>`<option value="${esc(c.nama)}">`).join('')}</datalist>
  <label class="f">No. WA<input id="f_hp"></label><label class="f" style="grid-column:1/-1">Alamat<input id="f_alamat"></label>
  <label class="f">Tanggal<input id="f_tgl" type="date" value="${TODAY}"></label><label class="f">Jatuh tempo<input id="f_tempo" type="date" value="${addD(TODAY,7)}"></label></div>
  <div class="tw"><table style="min-width:0"><thead><tr><th>Item</th><th>Qty</th><th>Harga</th><th></th></tr></thead><tbody id="ibody">${itemRow({desc:'Cuci AC',qty:1,harga:SERV['Cuci AC']})}</tbody></table></div>
  <div class="row" style="justify-content:space-between"><button type="button" class="btn sm" data-act="addRow">+ Tambah baris</button><label class="f" style="flex-direction:row;align-items:center;gap:8px">Diskon (Rp)<input id="f_diskon" type="number" min="0" value="0" style="width:120px"></label></div>
  <div class="row" style="justify-content:space-between"><b>Total</b><b class="num" id="itot" style="font-size:20px"></b></div>
  <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="close">Batal</button><button class="btn pri" type="submit">Simpan invoice</button></div></form>`,sh=>{
    invCalc();
    sh.addEventListener('input',invCalc);
    $('#f_nama',sh).addEventListener('change',e=>{const c=S.cust.find(x=>x.nama===e.target.value);if(c){$('#f_hp',sh).value=c.hp||'';$('#f_alamat',sh).value=c.alamat||''}});
    $('#f_ord',sh).addEventListener('change',e=>{const o=S.orders.find(x=>x.id===e.target.value);if(!o)return;$('#f_nama',sh).value=o.nama;$('#f_hp',sh).value=o.hp;$('#f_alamat',sh).value=o.alamat;$('#ibody',sh).innerHTML=itemRow({desc:o.layanan,qty:o.unit,harga:Math.round(o.nilai/Math.max(1,o.unit))});invCalc()});
    $('#mf',sh).addEventListener('submit',e=>{e.preventDefault();
      const items=$$('#ibody tr',sh).map(r=>({desc:$('[data-r=desc]',r).value,qty:Number($('[data-r=qty]',r).value)||1,harga:Number($('[data-r=harga]',r).value)||0})).filter(x=>x.desc);
      if(!items.length){toast('Isi minimal satu item');return}
      const ref=$('#f_ord',sh).value;
      S.inv.push({id:uid('i'),no:nxt,tgl:$('#f_tgl',sh).value,tempo:$('#f_tempo',sh).value,nama:$('#f_nama',sh).value,hp:$('#f_hp',sh).value,alamat:$('#f_alamat',sh).value,items,diskon:Number($('#f_diskon',sh).value)||0,status:'Belum',ref});
      save();closeModal();render();toast('Invoice '+nxt+' dibuat');
    });
  });
};
function invHTML(i){const t=invTot(i);
  return `<div class="inv">${kopHTML()}<div class="row" style="justify-content:space-between;align-items:flex-start"><div></div><div style="text-align:right"><b style="font-size:18px;letter-spacing:.08em">INVOICE</b><div class="num">${i.no}</div>${i.ref&&S.orders.some(q=>q.id===i.ref)?`<div style="font-size:12px;color:#4b6068">Ref. Order: <span class="num">${esc(i.ref)}</span> · Teknisi: ${esc(empNm(S.orders.find(q=>q.id===i.ref).teknisi))}</div>`:''}${(i.pnwNo||(S.pnw.find(q=>q.id===i.pnwId)||{}).no)?`<div style="font-size:12px;color:#4b6068">Ref. Penawaran: <span class="num">${esc(i.pnwNo||S.pnw.find(q=>q.id===i.pnwId).no)}</span></div>`:''}</div></div>

document.addEventListener('submit', async e => {
  if (e.target.id !== 'lf') return;
  e.preventDefault();

  const u = $('#lu').value.trim().toLowerCase();
  const p = $('#lp').value;
  const email = u + '@punggawa47.app'; 

  const btn = $('#lf button[type="submit"]');
  if(btn) { btn.disabled = true; btn.innerHTML = 'Memproses...'; }

  try {
    const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: p
    });

    if (authError) {
      console.error('LOGIN GAGAL:', authError, '| email dipakai:', email);
      L.err = 'Login gagal: ' + authError.message + ' (status ' + (authError.status||'?') + ') | email: ' + email;
      showLogin();
      return;
    }

    const { data: profile, error: profError } = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('id', authData.user.id)
      .single();

    if (profError || !profile || profile.status !== 'active') {
      console.error('PROFIL BERMASALAH:', profError, profile);
      L.err = 'Akun belum aktif / profil tidak ditemukan. ' + (profError ? profError.message : (profile ? 'status: '+profile.status : 'baris profiles kosong untuk user ini'));
      await supabaseClient.auth.signOut();
      showLogin();
      return;
    }

    SES = {
      role: profile.role,
      empId: profile.emp_id,
      nama: profile.nama
    };
    
    L.err = '';
    await bootData();
    render();
    window.scrollTo(0, 0);
    welcomeToast(SES.nama);

  } catch (err) {
    console.error(err);
    L.err = 'Terjadi kesalahan jaringan.';
    showLogin();
  } finally {
    if(btn) { btn.disabled = false; btn.innerHTML = 'Masuk'; }
  }
});

function paginate(k,rows,sig){
  if(U.pgs[k]!==sig){U.pgs[k]=sig;U.pg[k]=1}
  const n=rows.length,pages=Math.max(1,Math.ceil(n/PAGE)),p=Math.min(U.pg[k]||1,pages);U.pg[k]=p;const a=(p-1)*PAGE;
  let html='';
  if(n>PAGE){const nums=[];for(let i=Math.max(1,p-2);i<=Math.min(pages,p+2);i++)nums.push(i);
    html=`<div class="pager"><span>Menampilkan ${a+1}-${Math.min(n,a+PAGE)} dari ${n}</span><div class="row"><button class="btn sm" data-act="pg" data-k="${k}" data-p="${p-1}"${p<2?' disabled':''}>Sebelumnya</button>${nums.map(i=>`<button class="btn sm${i===p?' cur':''}" data-act="pg" data-k="${k}" data-p="${i}"${i===p?' aria-current="page"':''}>${i}</button>`).join('')}<button class="btn sm" data-act="pg" data-k="${k}" data-p="${p+1}"${p>=pages?' disabled':''}>Berikutnya</button></div></div>`}
  else if(n)html=`<div class="pager"><span>${n} data</span></div>`;
  return{items:rows.slice(a,a+PAGE),html};
}

<script>

const NKEEP=150;
const NI={
 wait:{c:'warn',p:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'},
 ok:{c:'good',p:'<path d="M5 12l4 4L19 7"/>'},

 S.notif.unshift({id:uid('n'),ts:Date.now(),roles:[].concat(roles),emp:o.emp||null,judul,teks:teks||'',tipe:o.tipe||'info',tab:o.tab||'',jobF:o.jobF||'',sub:o.sub||'',rd:{}});

 p.innerHTML=`<div class="np-h"><b>Pemberitahuan</b><div class="row" style="flex-wrap:nowrap"><button type="button" class="btn sm" data-act="npAll"${un.length?'':' disabled'}>Tandai semua dibaca</button><button type="button" class="btn sm" data-act="npClose" aria-label="Tutup">×</button></div></div>

ICON.akun='<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M17 11l2 2 3-3"/>';
{const _at=allowedTabs;allowedTabs=function(){const t=_at();return SES&&SES.role==='admin'&&!t.some(x=>x[0]==='akun')?t.concat([['akun','Akun Direktur']]):t}}

<script>
/* =====================================================================
   ABSENSI: klik "Absen masuk/pulang" -> muncul detail (tanggal, jam, lokasi)
   -> klik "Absen" untuk menyimpan -> popup hasil (berhasil / menunggu persetujuan).
   Tombol dikunci saat proses, jadi tidak bisa tercatat dobel.
   ===================================================================== */
const ABS={busy:false,p:null,kind:'',id:'',tm:null};
function absRow(l,v){return `<div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:1px solid var(--line,rgba(128,128,128,.25))"><span style="color:var(--muted)">${l}</span><div style="text-align:right">${v}</div></div>`}
function absLocHTML(p){
  if(!p)return '<span style="color:var(--muted)">Membaca lokasi GPS...</span>';
  const st=p.ok===false?`<span class="pill p-Batal">Di luar area kantor (${p.d} m, batas ${S.set.lok.rad} m)</span>`:p.ok?`<span class="pill p-Aman">Dalam area kantor (${p.d} m)</span>`:'<span class="pill p-Belum">Titik kantor belum diatur</span>';
  return `<a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" rel="noopener" class="num">${p.lat}, ${p.lng}</a><br><small style="color:var(--muted)">akurasi GPS ±${p.acc} m</small><br>${st}`;
}
function absStop(){if(ABS.tm){clearInterval(ABS.tm);ABS.tm=null}}
function absTick(){const j=$('#abs_jam'),t=$('#abs_tgl');if(!j){absStop();return}const d=new Date();j.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());if(t)t.textContent=fd(TODAY)}
async function absLoadPos(){
  const box=$('#abs_loc'),go=$('#abs_go');
  if(box)box.innerHTML=absLocHTML(null);
  if(go){go.disabled=true}
  const p=await pos();
  if(!$('#abs_loc'))return; /* modal sudah ditutup */
  ABS.p=p;
  if(!p){$('#abs_loc').innerHTML='<span style="color:var(--bad,#b91c1c)">Lokasi tidak terbaca. Izinkan akses lokasi di browser.</span><br><button type="button" class="btn sm" data-act="absRetry" style="margin-top:6px">Coba baca lokasi lagi</button>';return}
  $('#abs_loc').innerHTML=absLocHTML(p);
  const g=$('#abs_go');if(g)g.disabled=false;
  const w=$('#abs_warn');if(w)w.hidden=p.ok!==false;
}
function absModal(kind,id){
  const day=S.att[TODAY]||{},a=day[id],e=S.emps.find(x=>x.id===id)||{nama:SES.nama};
  if(kind==='masuk'&&a){toast('Absen masuk hari ini sudah tercatat'+(a.s==='Menunggu'?' (menunggu persetujuan Direktur)':''));return}
  if(kind==='pulang'){
    if(!a||a.s!=='Hadir'){toast(a&&a.s==='Menunggu'?'Absen masuk masih menunggu persetujuan Direktur':'Anda belum absen masuk');return}
    if(a.out){toast('Absen pulang hari ini sudah tercatat');return}
    if(a.outP){toast('Absen pulang masih menunggu persetujuan Direktur');return}
  }
  absStop();ABS.busy=false;ABS.p=null;ABS.kind=kind;ABS.id=id;
  modal(`<h2 style="font-size:20px">Absen ${kind}</h2>
  <div class="info">Periksa tanggal, jam, dan lokasi di bawah. Absen baru tercatat setelah Anda menekan tombol <b>Absen ${kind}</b>.</div>
  <div>${absRow('Nama','<b>'+esc(e.nama)+'</b>')}${absRow('Tanggal','<b id="abs_tgl">'+fd(TODAY)+'</b>')}${absRow('Jam','<b class="num" id="abs_jam" style="font-size:20px">--:--:--</b>')}${absRow('Lokasi','<div id="abs_loc"></div>')}</div>
  <div class="note" id="abs_warn" hidden style="margin-top:10px">Anda berada di luar area kantor. Absen akan masuk sebagai <b>menunggu persetujuan Direktur</b>.</div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn" data-act="close">Batal</button><button type="button" class="btn pri" id="abs_go" data-act="absGo" disabled>Absen ${kind}</button></div>`,
  ()=>{absTick();ABS.tm=setInterval(absTick,1000);absLoadPos()});
}
function absDo(kind,id,p){
  const day=(S.att[TODAY]=S.att[TODAY]||{}),a=day[id];
  if(kind==='masuk'){
    if(a)return{st:'dup'};
    if(p.ok===false){day[id]={s:'Menunggu',inP:nowHM(),out:'',loc:p};absReq(id,'masuk',p);save();render();return{st:'pending'}}
    day[id]={s:'Hadir',in:nowHM(),out:'',loc:p};save();render();return{st:'ok'}
  }
  if(!a||a.s!=='Hadir')return{st:'none'};
  if(a.out||a.outP)return{st:'dup'};
  if(p.ok===false){a.outP={t:nowHM(),loc:p};absReq(id,'pulang',p);save();render();return{st:'pending'}}
  a.out=nowHM();a.locOut=p;save();render();return{st:'ok'};
}
function absResult(r,kind,p){
  absStop();
  const jam=nowHM(),tgl=fd(TODAY);
  const M={
   ok:{ic:'✓',c:'#15803d',t:'Absen '+kind+' berhasil',d:'Absen '+kind+' Anda sudah tercatat.'},

<script>
/* Tombol WA: langsung ke aplikasi WhatsApp di komputer (tanpa tab baru). Jika aplikasi tidak ada, jatuh ke wa.me */
(function(){
 const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent),_wo=window.open.bind(window);
 function openWA(url){
  const m=String(url).match(/^https:\/\/wa\.me\/(\d*)\?text=([\s\S]*)$/);
  if(!m||mobile){_wo(url,'_blank','noopener');return}
  const app='whatsapp://send?'+(m[1]?'phone='+m[1]+'&':'')+'text='+m[2];
  let opened=false;const mark=()=>{opened=true};
  window.addEventListener('blur',mark,{once:true});document.addEventListener('visibilitychange',mark,{once:true});
  const a=document.createElement('a');a.href=app;a.style.display='none';document.body.appendChild(a);a.click();a.remove();
  try{toast('Membuka WhatsApp...')}catch(_){}
  setTimeout(()=>{window.removeEventListener('blur',mark);document.removeEventListener('visibilitychange',mark);if(!opened&&!document.hidden){try{toast('Aplikasi WhatsApp Desktop tidak terdeteksi, membuka WhatsApp Web')}catch(_){}_wo(url,'_blank','noopener')}},2500);
 }
 window.open=function(u){if(!mobile&&typeof u==='string'&&/^https:\/\/wa\.me\//.test(u)){openWA(u);return null}return _wo.apply(window,arguments)};
 document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="https://wa.me/"]');if(!a||mobile||e.button||e.ctrlKey||e.metaKey||e.shiftKey)return;e.preventDefault();openWA(a.href)},true);

function initBanks(){if(Array.isArray(S.set.banks))return;const str=(S.set.bank||'').trim();let b=[];
 if(str){const m=str.match(/^(\S+)\s+([\d\-\s.]+?)\s+a\.?\s?n\.?\s+(.+)$/i);b=[m?{id:uid('b'),nama:m[1],rek:m[2].trim(),an:m[3].trim()}:{id:uid('b'),nama:str,rek:'',an:''}]}

 S.set.banks.forEach(b=>{const nama=g(b,['nama','bank','namaBank','nm','name']),rek=g(b,['rek','norek','noRek','no_rek','nomor','noRekening','account']),an=g(b,['an','atasNama','a_n','pemilik','holder']);
  if(b.nama!==nama){b.nama=nama;ch=true}if(b.rek!==rek){b.rek=rek;ch=true}if(b.an!==an){b.an=an;ch=true}

{const _rb=render;render=function(){if(S&&S.set&&!Array.isArray(S.set.banks)){initBanks();save()}else if(repairBanks())save();return _rb.apply(this,arguments)}}

 <p style="margin:0 0 10px;color:var(--muted);font-size:13px">Saat mencatat pemasukan atau pengeluaran, admin memilih akunnya: Kas Kecil (saldo langsung bertambah atau berkurang) atau Bank (lalu pilih rekening dari daftar ini).</p>
 <div class="tw"><table><thead><tr><th>Akun</th><th>Keterangan</th><th class="r">Saldo</th><th></th></tr></thead><tbody>
 ${row('Kas Kecil','Uang tunai operasional',kas)}
 ${B.map(b=>row('Bank '+esc(b.nama),esc((b.rek||'-')+(b.an?' · a.n. '+b.an:'')),saldoBank(b.id),mg?`<button class="btn sm" data-act="bankEd" data-id="${esc(b.id)}">Ubah</button> <button class="btn sm del" data-act="bankDel" data-id="${esc(b.id)}">Hapus</button>`:'',1)).join('')}
 ${unk!=null?row('Bank (rekening belum dipilih)','Transaksi bank lama atau pembayaran invoice otomatis',unk,'',1):''}

 </tbody></table></div></div>`}

 <div class="tw"><table><thead><tr><th>Tanggal</th><th>Jurnal</th><th>Keterangan</th>${showBank?'<th>Rekening</th>':''}<th class="r">Masuk</th><th class="r">Keluar</th><th class="r">Saldo</th></tr></thead><tbody>${sh.length?sh.map(x=>{const t=x.t,mk=t.jenis==='Pemasukan';return `<tr><td>${fds(t.tgl)}</td><td class="num"><small>${esc(jKey(t))}</small></td><td>${esc(t.ket)}<br><small>${esc(t.kat)}</small></td>${showBank?`<td><small>${esc(bankNm(t)||'-')}</small></td>`:''}<td class="r num">${mk?rp(t.jml):'-'}</td><td class="r num">${mk?'-':rp(t.jml)}</td><td class="r num">${rp(x.run)}</td></tr>`}).join(''):`<tr><td colspan="${nc}" class="empty">Tidak ada mutasi pada periode ini.</td></tr>`}</tbody></table></div>${R.length>cap?`<small style="color:var(--muted)">Menampilkan ${cap} mutasi terbaru dari ${R.length}.</small>`:''}`}

 const t=(U.hisT&&U.hisT<=TODAY)?U.hisT:TODAY;U.hisT=t;
 const wide=isAp()||isSA()||isAdm(),me=absMe(),
  list=wide?absList().filter(e=>e.id!==DIR_ID||t>=dirStart()):(me?[empOf(me)]:[]),
  rows=list.map(e=>{const a=(S.att[t]||{})[e.id],l=(LBR()[t]||{})[e.id],lab=hisLbl(a,t),kp=S.req.some(r=>r.jenis==='abs'&&r.kind==='koreksi'&&r.st==='Menunggu'&&r.ref===e.id+'|'+t+'|koreksi');return{e,a,l,lab,kp}}),
  c=x=>rows.filter(r=>r.lab===x).length,nl=rows.filter(r=>r.l&&r.l.in).length;
 return `<div class="head"><div><h1>Riwayat Absen</h1><p>${HARI_F[pd(t).getDay()]}, ${fd(t)}${t===TODAY?' (hari ini)':''}</p></div></div>
 <div class="card"><div class="row" style="justify-content:space-between"><h3>Pilih tanggal</h3>
 <div class="row"><button class="btn sm" data-act="hisGo" data-n="-1" aria-label="Hari sebelumnya">◀</button><input id="hist" type="date" value="${t}" max="${TODAY}" data-chg="hisT" style="width:auto" aria-label="Pilih tanggal"><button class="btn sm" data-act="hisGo" data-n="1" aria-label="Hari berikutnya"${t>=TODAY?' disabled':''}>▶</button>${t!==TODAY?'<button class="btn sm" data-act="hisGo" data-n="0">Hari ini</button>':''}</div></div>
 ${wide?`<div class="row" style="margin:12px 0"><span class="pill p-Hadir">Hadir ${c('Hadir')+c('Hadir, telat')}</span><span class="pill p-Telat">Telat ${c('Hadir, telat')}</span><span class="pill p-Izin">Izin ${c('Izin')}</span><span class="pill p-Sakit">Sakit ${c('Sakit')}</span><span class="pill p-Alpa">Alpa ${c('Alpa')}</span><span class="pill p-Dicetak">Lembur ${nl}</span></div>`:''}
 <div class="tw" style="margin-top:12px"><table><thead><tr><th>Karyawan</th><th>Status</th><th>Masuk</th><th>Pulang</th><th>Lokasi</th><th>Lembur</th><th>Catatan</th></tr></thead><tbody>${rows.length?rows.map(r=>{const a=r.a,l=r.l;
  return `<tr><td><b>${esc(r.e.nama)}</b><br><small style="color:var(--muted)">${esc(r.e.jabatan||'')}</small></td><td><span class="pill p-${hisCls(r.lab)}">${r.lab}</span></td><td class="num">${a&&(a.in||a.inP)||'-'}</td><td class="num">${a&&(a.out||(a.outP?a.outP.t+' (menunggu)':''))||'-'}</td><td>${a&&a.loc?'Masuk: '+locBadge(a.loc)+(a.locOut?'<br><br>Pulang: '+locBadge(a.locOut):''):'-'}</td><td>${l&&l.in?`<span class="num">${esc(l.in)} - ${l.out?esc(l.out):'...'}</span>${l.out?'<br><small>'+durTxt(lbrMs(t,l))+'</small>':'<br><small>belum pulang</small>'}${l.ket?'<br><small>'+esc(l.ket)+'</small>':''}${l.loc&&l.loc.ok===false?'<br><span class="pill p-Batal">Di luar area</span>':''}`:'-'}</td><td>${a&&a.kor?'<span class="pill p-Dicetak">Dikoreksi</span><br><small>ACC '+esc(a.kor.by||'')+'</small>':''}${r.kp?'<span class="pill p-Menunggu">Koreksi menunggu ACC</span>':''}${!(a&&a.kor)&&!r.kp?'-':''}</td></tr>`}).join(''):'<tr><td colspan="7" class="empty">Belum ada data karyawan.</td></tr>'}</tbody></table></div>
 <p style="color:var(--muted);margin:8px 0 0;font-size:12px">Hari Minggu ditandai libur. Lupa absen di tanggal ini? Ajukan lewat tab Koreksi Absen.</p></div>`}

/* ---------- Pasang ke menu Absensi ---------- */
{const _v=V.abs;V.abs=()=>{const s=absSub();return s==='lbr'?absBar()+absLembur():s==='koa'?absBar()+absKoreksi():s==='his'?absBar()+absRiwayat():_v()}}
{const _t=V.absT;V.absT=()=>{if(!ABS_PERS.includes(SES.role))return _t();const s=absSub();return absBar()+(s==='lbr'?absLembur():s==='koa'?absKoreksi():s==='his'?absRiwayat():_t())}}

<script>
/* =====================================================================
   PERBAIKAN SINKRON AKUN / PEGAWAI / ABSEN (dipasang paling akhir) - versi sync-v3
   ===================================================================== */
const _nrm=x=>String(x||'').trim().toLowerCase().replace(/\s+/g,' ');
const akMissEmp=u=>u&&u.status==='active'&&u.emp_id&&u.role&&!['admin','direktur'].includes(u.role)&&!S.emps.some(e=>e.id===u.emp_id)&&!(S.empsOld||[]).some(e=>e.id===u.emp_id);
const akTodo=()=>AK.items.filter(u=>(u.status==='active'&&akNeedEmp(u))||akMissEmp(u));
function attOrphans(){const ids=new Set([...S.emps,...(S.empsOld||[])].map(e=>e.id)),out=[];
 Object.keys(S.att||{}).forEach(t=>Object.keys(S.att[t]||{}).forEach(k=>{if(k!==DIR_ID&&!ids.has(k))out.push({t,k})}));return out}
A.akSinkron=async()=>{const L=akTodo();let n=0;
 for(const u of L){
  if(akMissEmp(u)){const ex=S.emps.find(e=>e.user&&e.user===u.username);
   if(ex){const {error}=await supabaseClient.from('profiles').update({emp_id:ex.id}).eq('id',u.id);if(error){toast('Gagal: '+error.message);break}}
   else{const m=akMakeEmp(u,'');m.E.id=u.emp_id;S.emps.push(m.E)}}
  else{const m=akMakeEmp(u,'');const {error}=await supabaseClient.from('profiles').update({emp_id:m.E.id}).eq('id',u.id);
   if(error){toast('Gagal: '+error.message);break}if(m.isNew)S.emps.push(m.E)}
  n++}
 save();await akLoad(true);render();toast(n?n+' akun disambungkan ke data karyawan. Karyawan yang bersangkutan perlu keluar lalu masuk lagi.':'Semua akun sudah tersambung',5000)};
A.attFix=async()=>{const O=attOrphans(),keys=[...new Set(O.map(o=>o.k))];let moved=0,made=0,skip=0;
 for(const k of keys){const pr=AK.items.find(u=>u.emp_id===k);if(!pr){skip++;continue}
  let tg=S.emps.find(e=>e.user&&e.user===pr.username)||S.emps.find(e=>_nrm(e.nama)===_nrm(pr.nama));
  if(tg){O.filter(o=>o.k===k).forEach(o=>{const d=S.att[o.t];if(!d[tg.id])d[tg.id]=d[k];delete d[k];moved++});
   const {error}=await supabaseClient.from('profiles').update({emp_id:tg.id}).eq('id',pr.id);if(error){toast('Gagal: '+error.message);return}}
  else{const m=akMakeEmp(pr,'');m.E.id=k;S.emps.push(m.E);made++}}
 save();await akLoad(true);render();
 toast('Selesai: '+moved+' absen dipindah, '+made+' pegawai dibuat'+(skip?', '+skip+' tidak bisa dicocokkan':'')+'. Karyawan terkait perlu keluar lalu masuk lagi.',6000)};
/* Hapus pegawai = akun login pegawai itu ikut dinonaktifkan (tidak bisa masuk lagi). Hapus permanen tetap lewat Kelola Akun. */
{const _ph=pegHapus;pegHapus=function(e,al){_ph(e,al);
 const u=AK.items.find(x=>(x.emp_id&&x.emp_id===e.id)||(e.user&&x.username===e.user));
 if(!u||['admin','direktur'].includes(u.role)||u.status==='inactive')return;
 supabaseClient.from('profiles').update({status:'inactive'}).eq('id',u.id).then(({error})=>{
  if(error){toast('Pegawai dihapus, tapi akun login gagal dinonaktifkan: '+error.message,6000);return}
  toast('Pegawai '+e.nama+' dihapus dan akun login '+(u.username||'')+' dinonaktifkan',4500);akLoad(true)})}}
const orphRows=()=>{const E=S.emps.slice().sort((a,b)=>String(a.nama).localeCompare(String(b.nama)));
 return attOrphans().sort((a,b)=>b.t.localeCompare(a.t)).map(o=>{const a=S.att[o.t][o.k]||{};
  const opt=E.filter(e=>!S.att[o.t][e.id]).map(e=>`<option value="${esc(e.id)}">${esc(e.nama)} (${esc(e.jabatan||'')})</option>`).join('');
  return `<tr data-t="${esc(o.t)}" data-k="${esc(o.k)}"><td>${fds(o.t)}</td><td class="num">${esc(o.k)}</td><td class="num">${esc(a.in||a.inP||'-')} / ${esc(a.out||'-')}</td><td><select><option value="">Pilih pegawai...</option>${opt}</select></td><td class="r"><button class="btn sm pri" data-act="orMove">Pindahkan</button> <button class="btn sm del" data-act="orDel">Hapus</button></td></tr>`}).join('')};
A.orMove=b=>{const tr=b.closest('tr'),t=tr.dataset.t,k=tr.dataset.k,to=tr.querySelector('select').value;
 if(!to){toast('Pilih pegawainya dulu');return}const d=S.att[t];if(!d||!d[k]||d[to])return;d[to]=d[k];delete d[k];save();render();toast('Absen dipindahkan')};
A.orDel=b=>{const tr=b.closest('tr'),t=tr.dataset.t,k=tr.dataset.k;if(!confirm('Hapus catatan absen ini? Tindakan ini tidak bisa dibatalkan.'))return;
 if(S.att[t]){delete S.att[t][k];save();render();toast('Catatan absen dihapus')}};
{const _pg=V.peg;V.peg=()=>{const h=_pg();if(!(isAp()||isSA()))return h;
 const A0=AK.items,ak=A0.filter(u=>u.status==='active').length,wt=A0.filter(u=>u.status==='pending').length,td=akTodo().length,o=attOrphans(),no=new Set(o.map(x=>x.k)).size;
 return h+`<div class="card"><h3>Cek sinkron akun dan pegawai <small style="color:var(--muted);font-weight:400">(sync-v3)</small></h3>
  <p style="margin:0 0 10px;font-size:13px">${A0.length?`Akun terdaftar <b>${A0.length}</b> (aktif ${ak}, menunggu ${wt}, nonaktif ${A0.length-ak-wt}) · Data pegawai <b>${S.emps.length}</b> · Akun aktif belum tersambung <b>${td}</b>`:'Memuat daftar akun...'}</p>
  ${wt?`<div class="note">Ada <b>${wt}</b> akun masih menunggu persetujuan. Setujui dulu di menu Persetujuan, tab Akun.</div>`:''}
  ${td?`<button class="btn pri" data-act="akSinkron">Sinkronkan ${td} akun ke data karyawan</button>`:''}
  ${no?`<div class="note" style="margin-top:10px">Ada absen dari <b>${no}</b> ID yang tidak cocok dengan daftar pegawai, jadi terbaca "belum absen". Pilih pegawai yang benar di tabel ini, lalu tekan Pindahkan.</div><div class="tw"><table style="min-width:0"><thead><tr><th>Tanggal</th><th>ID absen</th><th>Masuk / Pulang</th><th>Milik pegawai</th><th></th></tr></thead><tbody>${orphRows()}</tbody></table></div>${[...new Set(o.map(x=>x.k))].some(k=>A0.some(u=>u.emp_id===k))?'<button class="btn pri" data-act="attFix" style="margin-top:10px">Cocokkan otomatis yang bisa dikenali</button>':''}`:''}
  ${(A0.length&&!td&&!no&&!wt)?'<div class="info">Semua akun aktif sudah tersambung ke data pegawai.</div>':''}</div>`}}
setInterval(async()=>{try{
 if(!SES||!SYNC.ready||SYNC.busy||SYNC.pend||document.hidden)return;
 const m=$('#modal'),ae=document.activeElement;if((m&&!m.hidden)||(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)))return;
 const {data,error}=await supabaseClient.from('app_state').select('key,value').in('key',['att','emps','req','lbr']);
 if(error||!data)return;let ch=false;
 data.forEach(r=>{const sj=jj(r.value);if(sj===jj(S[r.key]))return;if(SYNC.snap[r.key]!==jj(S[r.key]))return;S[r.key]=r.value;SYNC.snap[r.key]=sj;ch=true});
 if(ch){if(typeof mig==='function')mig();render()}}catch(e){console.error(e)}},20000);
</script>
<script>
/* Pemberitahuan "aplikasi diperbarui": tampil SEKALI per pengguna per perangkat. Ganti NOTE_VER untuk menampilkan lagi. */
{const NOTE_VER='v1';
 A.reloadNow=async()=>{try{await syncNow()}catch(e){}
  try{if('serviceWorker' in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}}catch(e){}
  try{if(window.caches){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}}catch(e){}
  location.reload()};
 const tm=setInterval(()=>{try{
  if(!SES||!S||/^#investor=/.test(location.hash))return;
  const m=$('#modal');if(!m||!m.hidden)return;
  const key='punggawa.notif.'+NOTE_VER+'.'+(SES.role||'')+'.'+(SES.empId||'')+'.'+(SES.nama||'');
  let done=false;try{done=!!localStorage.getItem(key)}catch(e){}
  clearInterval(tm);if(done)return;
  try{localStorage.setItem(key,'1')}catch(e){}
  modal(`<h2 style="font-size:20px">Aplikasi baru saja diperbarui</h2><div class="info">Ada perbaikan pada data karyawan, akun, dan absensi. Mohon <b>muat ulang halaman</b> agar tampilan Anda ikut terbarui. Jika absen Anda sebelumnya tidak terbaca, setelah itu keluar lalu masuk lagi.</div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Nanti</button><button class="btn pri" data-act="reloadNow">Muat ulang sekarang</button></div>`)
 }catch(e){console.error(e)}},1500)}
</script>
